<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#8EBF45" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Plant OS" />
    <link rel="manifest" href="/manifest.json" />
    <title>Plant Management OS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Lexend:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                dark: 'var(--brand-dark, #0D0D0D)',
                primary: 'var(--brand-primary, #8EBF45)',
                primaryHover: 'var(--brand-primary-hover, #7cb037)',
                secondary: 'var(--brand-secondary, #658C3E)',
                focus: 'var(--brand-focus, #527a23)',
                accent: 'var(--brand-accent, #A8BF75)',
                header: 'var(--brand-header-bg, #0D0D0D)',
                footer: 'var(--brand-footer-bg, #0D0D0D)',
                canvas: 'var(--brand-canvas, #F8FAFC)',
                text: 'var(--brand-text, #1E293B)',
              }
            },
            fontFamily: {
              brand: ['Lexend', 'sans-serif'],
              body: ['Inter', 'sans-serif'],
            }
          }
        }
      }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    <link rel="stylesheet" href="/index.css" />
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://aistudiocdn.com/react-dom@^18.2.0/",
    "react/": "https://aistudiocdn.com/react@^18.2.0/",
    "react": "https://aistudiocdn.com/react@^18.2.0",
    "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2",
    "qrcode.react": "https://esm.sh/qrcode.react@3.1.0",
    "@vitejs/plugin-react": "https://aistudiocdn.com/@vitejs/plugin-react@^5.1.1",
    "vite": "https://aistudiocdn.com/vite@^7.2.6",
    "@google/generative-ai": "https://aistudiocdn.com/@google/generative-ai@^0.24.1",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.31.0",
    "pdfjs-dist": "https://esm.sh/pdfjs-dist@3.11.174",
    "path": "https://esm.sh/path@^0.12.7"
  }
}
</script>
<style>
  :root {
    --brand-dark: #0D0D0D;
    --brand-primary: #8EBF45;
    --brand-primary-hover: #7cb037;
    --brand-secondary: #658C3E;
    --brand-focus: #527a23;
    --brand-accent: #A8BF75;
    --brand-header-bg: #0D0D0D;
    --brand-footer-bg: #0D0D0D;
    --brand-canvas: #F8FAFC;
    --brand-text: #1E293B;
  }
  body {
    font-family: 'Inter', sans-serif;
    color: var(--brand-text);
    background-color: var(--brand-canvas);
  }
  h1, h2, h3, h4, .font-brand {
    font-family: 'Lexend', sans-serif;
  }
  .bg-brand-primary { background-color: var(--brand-primary); }
  .bg-brand-secondary { background-color: var(--brand-secondary); }
  .bg-brand-dark { background-color: var(--brand-dark); }
  .text-brand-primary { color: var(--brand-primary); }
  .text-brand-secondary { color: var(--brand-secondary); }
  .text-brand-dark { color: var(--brand-dark); }
  .border-brand-accent { border-color: var(--brand-accent); }
  
  /* Disable spin buttons and appearance quirks on all numeric inputs */
  input[type=number] {
    -moz-appearance: textfield;
    appearance: textfield;
  }
  input[type=number]::-webkit-inner-spin-button,
  input[type=number]::-webkit-outer-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }
</style>

</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js').then(function(reg) {
            console.log('[PWA] ServiceWorker registered with scope:', reg.scope);
          }).catch(function(err) {
            console.warn('[PWA] ServiceWorker registration failed:', err);
          });
        });
      }
    </script>
  </body>
</html>
